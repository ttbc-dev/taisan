name: Rust

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence records cite non-head slice revisions; the doc tests
          # resolve them via `git cat-file`, which a depth-1 checkout cannot.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The runner image ships toolchains this job never uses; the
      # restored cargo cache plus a full workspace build/test/clippy
      # otherwise exhausts the SSD (os error 28 / ld bus error).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked --workspace

      # The reference isolation profile declares bwrap: installs it so
      # contained-launch contract tests gather real namespace evidence
      # instead of skipping (docs/v0.3.md OPS-01). Ubuntu restricts
      # unprivileged user namespaces via AppArmor by default; the
      # sysctl lifts that restriction for the runner only.
      - name: Install the sandbox primitive
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      # Contract tests spawn target/debug/workloop-fixture-worker, so build
      # must run before test in the same job.
      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
