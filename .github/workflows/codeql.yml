name: CodeQL

# Semantic scanning layer (issue #490). `actions` analyses the workflow
# files themselves; `rust` analyses the workspace source. Rust support
# and build-less database creation are GA since CodeQL CLI 2.23.3
# (2025-10-14), so `build-mode: none` covers both languages without a
# cargo build. The nightly run matters because CodeQL's query packs and
# bundled databases change independently of this repository — a
# scheduled run finds what a new query would have flagged in code that
# has not been touched.
#
# Semgrep is deliberately not shipped as a second SAST layer: CodeQL's
# security-extended suite is the deeper analyzer for this codebase,
# Semgrep's Rust coverage is thinner, and `semgrep ci` would add a
# SEMGREP_APP_TOKEN service dependency plus a second triage surface for
# marginal incremental coverage. Revisit if fast PR-time pattern rules
# become a requirement.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, off the hour: GitHub queues a large number of jobs
    # scheduled on round times, which delays them.
    - cron: '41 5 * * *'

# Jobs grant their own GITHUB_TOKEN permissions; the default is none.
permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    # Pull requests from forks and Dependabot-triggered runs both get a
    # read-only GITHUB_TOKEN, so their SARIF upload (security-events:
    # write) can never succeed — but the analysis itself needs no
    # token. Every pull request therefore still runs the full scan
    # before merge; only the result delivery differs. Restricted runs
    # write the SARIF out and keep it as a plain workflow artifact
    # instead of posting it to Code Scanning, while push-to-main and
    # the nightly run keep uploading everything that lands — including
    # merged Dependabot changes.
    # The capability check keys on PR author, not actor — Dependabot-authored
    # PRs keep the read-only token even when a human re-runs the job.
    env:
      CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}

    permissions:
      contents: read
      # Uploading the SARIF results is what needs this.
      security-events: write
      # CodeQL reads workflow run status to attribute alerts to runs.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` covers the workflows; dropping it would narrow
        # coverage for a repository that pins every action by SHA.
        # `rust` is GA and build-less since 2025-10-14 (see header).
        language: [rust, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-less Rust extraction still shells out to cargo for
      # workspace/dependency resolution; pin the same toolchain source
      # as rust.yml so the scan does not drift with the runner image.
      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          # Neither language needs a build; the analysis reads the
          # source.
          build-mode: none
          # Wider than the `default` suite. The extra dataflow queries
          # are worth the additional findings to triage for a tool that
          # bridges credentials into agent execution environments.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
          # The SARIF upload is what needs security-events: write, so
          # on token-restricted runs it is skipped outright rather than
          # failing at the code-scanning endpoint; the file is kept as
          # a run artifact by the next step instead.
          output: ${{ github.workspace }}/codeql-sarif
          upload: ${{ env.CAN_UPLOAD_SARIF == 'true' && 'always' || 'never' }}
          # With nothing uploaded there is nothing to wait on — the
          # poll would also run against the same restricted endpoint.
          wait-for-processing: ${{ env.CAN_UPLOAD_SARIF }}

      # Artifact upload runs on the runtime token, not GITHUB_TOKEN, so
      # it works under the read-only permissions fork and Dependabot
      # runs get. if-no-files-found fails loudly when analyze produced
      # no SARIF — a silent pass would hide a broken scan.
      - name: Keep SARIF as a run artifact
        if: env.CAN_UPLOAD_SARIF != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ github.workspace }}/codeql-sarif
          if-no-files-found: error
          retention-days: 14
