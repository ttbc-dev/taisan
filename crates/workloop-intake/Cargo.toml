[package]
name = "workloop-intake"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
workloop-config = { path = "../workloop-config" }
workloop-core = { path = "../workloop-core" }
workloop-store = { path = "../workloop-store" }
workloop-exec = { path = "../workloop-exec" }
workloop-selector = { path = "../workloop-selector" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The mid-batch fault test installs a deterministic trigger that
# aborts one selector-origin decision insert on the file-backed store.
rusqlite = { version = "0.32", features = ["bundled"] }
