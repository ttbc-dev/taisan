[package]
name = "workloop-cli"
edition.workspace = true
default-run = "taisan"
description = "taisan command-line interface"

[dependencies]
workloop-config = { path = "../workloop-config" }
workloop-core = { path = "../workloop-core" }
workloop-store = { path = "../workloop-store" }
workloop-exec = { path = "../workloop-exec" }
workloop-github = { path = "../workloop-github" }
workloop-intake = { path = "../workloop-intake" }
workloop-selector = { path = "../workloop-selector" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
# The propose suite installs a deterministic mid-batch store fault
# (a trigger aborting one decision save) directly on the SQLite store.
rusqlite = { version = "0.32", features = ["bundled"] }
