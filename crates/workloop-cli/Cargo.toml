[package]
name = "workloop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "taisan"
description = "taisan command-line interface"

# dist settings for this package's release app.
[package.metadata.dist]
# Declares this package a shipped app — cargo-dist only builds
# declared apps. All workspace crates inherit `0.3.0` since the #370
# freeze alignment.
dist = true
# The Homebrew formula is named after the shipped CLI, not the
# crate-internal package name.
formula = "taisan"
# This package also builds the s1-bridge scenario bridge and the
# legacy-named workloop-cli binary; the override keeps only taisan
# in the release artifacts and installers.
[package.metadata.dist.binaries]
x86_64-apple-darwin = ["taisan"]
aarch64-apple-darwin = ["taisan"]
x86_64-unknown-linux-gnu = ["taisan"]
aarch64-unknown-linux-gnu = ["taisan"]

# cargo-binstall manifest so `cargo binstall --git ... --bin taisan`
# fetches the cargo-dist prebuilt archive instead of compiling (the
# archive holds only taisan; without --bin binstall requires every
# declared bin and falls back to a source build).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dependencies]
workloop-config = { path = "../workloop-config" }
workloop-core = { path = "../workloop-core" }
workloop-store = { path = "../workloop-store" }
workloop-exec = { path = "../workloop-exec" }
workloop-github = { path = "../workloop-github" }
workloop-intake = { path = "../workloop-intake" }
workloop-selector = { path = "../workloop-selector" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2"
workloop-evidence-protocol = { version = "0.3.0", path = "../workloop-evidence-protocol" }

[dev-dependencies]
# The propose suite installs a deterministic mid-batch store fault
# (a trigger aborting one decision save) directly on the SQLite store.
rusqlite = { version = "0.32", features = ["bundled"] }
