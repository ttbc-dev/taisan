[package]
name = "workloop-selector"
version.workspace = true
edition.workspace = true
description = "public-issue-selector — taisan reference Selector adapter"
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The Homebrew formula is named after the shipped binary.
[package.metadata.dist]
# Declares this package a shipped app (cargo-dist builds declared
# apps only); see workloop-cli.
dist = true
formula = "public-issue-selector"

# cargo-binstall manifest for cargo-dist prebuilt archives.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dependencies]
workloop-core = { path = "../workloop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
workloop-store = { path = "../workloop-store" }
