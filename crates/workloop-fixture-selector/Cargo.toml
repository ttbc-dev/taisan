[package]
name = "workloop-fixture-selector"
edition.workspace = true
license.workspace = true

# Test fixture, not release surface: `[workspace.metadata.dist].packages`
# does not suppress cargo-dist's auto-detection of other binary crates —
# a versioned crate outside the list still ships (verified with dist
# 0.34.0). The #370 version freeze gives every crate a version, so pin
# the exclusion here; see workloop-executor.
[package.metadata.dist]
dist = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
