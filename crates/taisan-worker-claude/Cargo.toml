[package]
name = "taisan-worker-claude"
edition.workspace = true
description = "taisan-worker-claude — taisan reference Worker adapter"
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Required while workspace crates carry no `version` field (0.0.0 →
# publish = false, which dist otherwise skips); see workloop-cli.
[package.metadata.dist]
dist = true

# cargo-binstall manifest for cargo-dist prebuilt archives.
[package.metadata.binstall]
pkg-url = "{ repo-url }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dependencies]
workloop-core = { path = "../workloop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
